<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1a4a3a" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kinesia" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />

    <!-- Général -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="Massothérapie · Kinésithérapie — Comprendre ta douleur et retrouver ton équilibre." />
    <title>Kinesia Relief</title>
    <meta name="build" content="v2" />
  </head>
  <body>
    <div id="root">
      <!-- Splash affiché pendant le chargement du JS, retiré automatiquement par React -->
      <div id="splash" style="
        position:fixed;inset:0;
        background:#1a4a3a;
        display:flex;flex-direction:column;
        align-items:center;justify-content:center;
        gap:20px;z-index:9999;
      ">
        <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="32" cy="32" r="30" stroke="#4CAF82" stroke-width="3" opacity="0.3"/>
          <path d="M32 8 C20 8 12 18 12 28 C12 42 32 56 32 56 C32 56 52 42 52 28 C52 18 44 8 32 8Z" fill="#4CAF82" opacity="0.8"/>
        </svg>
        <div style="color:#4CAF82;font-family:sans-serif;font-size:22px;font-weight:600;letter-spacing:1px;">Kinesia Relief</div>
        <div style="width:48px;height:3px;background:#4CAF82;border-radius:2px;animation:ld 1.2s ease-in-out infinite alternate;"></div>
        <style>@keyframes ld{from{opacity:.3;transform:scaleX(.5)}to{opacity:1;transform:scaleX(1)}}</style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
